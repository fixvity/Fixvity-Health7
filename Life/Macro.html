<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Macro Calculator – Medical Standard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --primary:#2563eb;
  --bg:#f4f7fb;
  --card:#ffffff;
  --radius:16px;
  --text:#1f2937;
  --muted:#6b7280;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:var(--text);
}
.container{max-width:1100px;margin:auto;padding:20px}
.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:28px;
  box-shadow:0 14px 36px rgba(0,0,0,.08);
  margin-bottom:20px;
}
h1,h2{margin:0 0 10px;color:var(--primary)}
small{color:var(--muted)}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;
}

.field{display:flex;flex-direction:column}
.field label{font-size:14px;margin-bottom:6px}
.field input,.field select{
  height:52px;
  padding:12px 14px;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ddd;
}

button{
  width:100%;
  padding:18px;
  background:var(--primary);
  color:#fff;
  border:none;
  border-radius:14px;
  font-size:18px;
  cursor:pointer;
}

.results{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;
}
.box{
  background:#f8fafc;
  padding:18px;
  border-radius:12px;
  text-align:center;
}
.box b{font-size:22px}

canvas{max-width:100%;margin-top:20px}

.note{
  background:#f1f5f9;
  padding:14px;
  border-radius:12px;
  font-size:14px;
  line-height:1.6;
}
</style>
</head>

<body>
<div class="container">

<!-- INPUT -->
<div class="card">
<h1>Macro Calculator</h1>
<small>Calories · Protein · Carbs · Fat · Medical standard</small>

<div class="grid">

  <div class="field">
    <label>Units</label>
    <select id="unit">
      <option value="metric">Metric (kg / cm)</option>
      <option value="us">US (lb / ft)</option>
    </select>
  </div>

  <div class="field">
    <label>Diet Mode</label>
    <select id="diet">
      <option value="balanced">Balanced</option>
      <option value="lowcarb">Low-carb</option>
      <option value="keto">Keto</option>
    </select>
  </div>

  <div class="field">
    <label>Gender</label>
    <select id="gender">
      <option value="male">Male</option>
      <option value="female">Female</option>
    </select>
  </div>

  <div class="field">
    <label>Age</label>
    <input id="age" type="number">
  </div>

  <div class="field">
    <label>Height</label>
    <input id="height" type="number">
  </div>

  <div class="field">
    <label>Weight</label>
    <input id="weight" type="number">
  </div>

  <div class="field">
    <label>Activity</label>
    <select id="activity">
      <option value="1.2">Sedentary</option>
      <option value="1.375">Light</option>
      <option value="1.55">Moderate</option>
      <option value="1.725">Very active</option>
    </select>
  </div>

  <div class="field">
    <label>Workout calories (optional)</label>
    <input id="workout" type="number" placeholder="kcal burned">
  </div>

  <div class="field">
    <label>Goal</label>
    <select id="goal">
      <option value="maintain">Maintain</option>
      <option value="lose">Fat loss</option>
      <option value="gain">Muscle gain</option>
      <option value="recomp">Recomposition</option>
    </select>
  </div>

</div>

<br>
<button onclick="calculate()">Calculate Macros</button>
<button onclick="window.print()" style="margin-top:10px;background:#111">📄 Export PDF</button>
</div>

<!-- RESULTS -->
<div class="card">
<div class="results">
  <div class="box">Calories<br><b id="calories">—</b> kcal</div>
  <div class="box">Protein<br><b id="protein">—</b> g</div>
  <div class="box">Carbs<br><b id="carbs">—</b> g</div>
  <div class="box">Fat<br><b id="fat">—</b> g</div>
</div>

<canvas id="macroChart" height="240"></canvas>
<div class="note" id="insight"></div>
</div>

</div>

<script>
let chart;

function calculate(){
  let h=+height.value, w=+weight.value;
  if(unit.value==="us"){
    h*=2.54;       // inches to cm
    w*=0.453592;   // lb to kg
  }

  const a=+age.value, g=gender.value;
  if(!a||!h||!w){alert("Fill all fields");return;}

  let bmr = g==="male"
    ? (10*w+6.25*h-5*a+5)
    : (10*w+6.25*h-5*a-161);

  let calories=bmr*+activity.value;
  if(goal.value==="lose") calories-=400;
  if(goal.value==="gain") calories+=300;

  calories += +workout.value||0;

  let protein=w*(goal.value==="gain"?2.2:goal.value==="recomp"?2.0:1.8);

  let fat, carbs;
  if(diet.value==="keto"){
    carbs=30;
    fat=(calories-(protein*4+carbs*4))/9;
  }else if(diet.value==="lowcarb"){
    carbs=100;
    fat=(calories-(protein*4+carbs*4))/9;
  }else{
    fat=(calories*0.25)/9;
    carbs=(calories-(protein*4+fat*9))/4;
  }

  caloriesEl.textContent=Math.round(calories);
  proteinEl.textContent=Math.round(protein);
  carbsEl.textContent=Math.round(carbs);
  fatEl.textContent=Math.round(fat);

  insight.innerHTML=`
  <b>Mode:</b> ${diet.value.toUpperCase()}<br>
  <b>Workout calories added:</b> ${workout.value||0} kcal<br><br>
  <b>Medical note:</b> Values are estimates for healthy adults.
  Keto & low-carb modes adjust macro ratios only, not calorie needs.
  `;

  drawChart(protein,carbs,fat);
}

function drawChart(p,c,f){
  if(chart) chart.destroy();
  chart=new Chart(macroChart,{
    type:"pie",
    data:{
      labels:["Protein","Carbs","Fat"],
      datasets:[{data:[p*4,c*4,f*9],
      backgroundColor:["#60a5fa","#34d399","#fbbf24"]}]
    },
    options:{plugins:{legend:{position:"bottom"}}}
  });
}

const caloriesEl=calories, proteinEl=protein,
carbsEl=carbs, fatEl=fat, insight=document.getElementById("insight");
</script>

</body>
</html>
